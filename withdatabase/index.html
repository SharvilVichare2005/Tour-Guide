<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalGuide - Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="/js/env.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i data-lucide="map-pin" class="login-logo-icon"></i>
        </div>
        <h1 class="login-title">Welcome to LocalGuide</h1>
        <p class="login-description">Enter your credentials to access your account</p>
      </div>
      <div class="login-content">
        <form id="loginForm" class="login-form">
          <div id="errorMessage" class="error-message" style="display: none;"></div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="your.email@example.com" required>
          </div>
          <div class="form-group">
            <div class="password-header">
              <label for="password">Password</label>
              <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            <input id="password" type="password" required>
          </div>
          <button type="submit" class="login-button" id="loginButton">Sign in</button>
        </form>
      </div>
      <div class="login-footer">
        <div class="divider">
          <span>Or continue with</span>
        </div>
        <div class="social-login">
          <button class="social-button">Google</button>
          <button class="social-button">Apple</button>
          <button class="social-button">Facebook</button>
        </div>
        <div class="signup-link">
          Don't have an account? <a href="#">Sign up</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>
  <script>
    // Initialize Lucide icons
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
